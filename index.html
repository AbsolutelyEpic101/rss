<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EASY RSS 😎</title>
<style>
:root {
  color-scheme: light;
  --bg:#fff; --fg:#000; --muted:#767676; --soft:#ececec; --wash:#f3f3f3;
  --r:22px;
}
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100% }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.5 "Helvetica Neue",Helvetica,Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a { color:inherit }
button, input { font:inherit; color:inherit }
button { cursor:pointer }
:focus-visible { outline:2px solid var(--fg); outline-offset:3px }
.hidden { display:none !important }
.wrap { max-width:1180px; margin:0 auto; padding:0 28px }

/* ---------- header ---------- */
.head {
  display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
  padding-top:44px; padding-bottom:26px;
}
.title {
  margin:0; font-size:clamp(46px,9.5vw,104px); line-height:.95; font-weight:800;
  letter-spacing:-.045em;
}
.actions { display:flex; gap:10px; padding-bottom:6px }
.pill {
  border:1.5px solid var(--fg); background:var(--bg); border-radius:999px;
  padding:10px 22px; font-size:16px; font-weight:600; line-height:1.2;
  transition:background .15s, color .15s;
}
.pill:hover { background:var(--fg); color:var(--bg) }
.pill.solid { background:var(--fg); color:var(--bg) }
.pill.solid:hover { background:var(--bg); color:var(--fg) }
.pill.small { padding:7px 16px; font-size:14px; font-weight:500 }
.pill:disabled { opacity:.4; cursor:default }

.searchbar { padding-bottom:22px }
.searchbar input {
  width:100%; border:1.5px solid var(--fg); border-radius:999px; background:var(--bg);
  padding:14px 24px; font-size:18px;
}
.searchbar input:focus { outline:none; box-shadow:0 0 0 3px var(--soft) }
.searchbar input::placeholder { color:var(--muted) }

/* ---------- tabs ---------- */
.tabsbar { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0 18px }
.tabs {
  display:inline-flex; gap:4px; padding:5px; background:var(--wash);
  border-radius:999px; max-width:100%; overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none }
.tab {
  border:0; background:none; border-radius:999px; padding:10px 24px;
  font-size:16px; font-weight:600; color:var(--muted); white-space:nowrap;
  transition:background .15s, color .15s;
}
.tab:hover { color:var(--fg) }
.tab[aria-selected="true"] { background:var(--fg); color:var(--bg) }
.filterline { margin-top:14px }
.chip {
  display:inline-flex; align-items:center; gap:4px; background:var(--wash);
  border-radius:999px; padding:5px 6px 5px 16px; font-size:14px; font-weight:500;
}
.chip button { border:0; background:none; font-size:18px; line-height:1; padding:2px 8px; border-radius:999px }
.chip button:hover { background:var(--soft) }

/* ---------- lists ---------- */
.grid { display:grid; gap:36px 24px; padding:8px 0 80px }
.grid.videos { grid-template-columns:repeat(auto-fill,minmax(280px,1fr)) }
.grid.shorts { grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:32px 18px }
.grid.news { grid-template-columns:1fr; gap:0; max-width:820px }

.thumb { display:block; background:var(--wash); overflow:hidden; border-radius:var(--r) }
.videos .thumb { aspect-ratio:16/9 }
.shorts .thumb { aspect-ratio:9/16 }
.thumb img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .3s;
}
.thumb:hover img { transform:scale(1.03) }
.item h3 { margin:12px 0 0; font-size:17px; line-height:1.3; font-weight:400; letter-spacing:-.01em }
.shorts .item h3 { font-size:15px }
.item h3 a { text-decoration:none }
.item h3 a:hover { text-decoration:underline; text-underline-offset:3px }
.item .meta { margin-top:5px; font-size:13px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap }
.item.read h3 a { color:var(--muted) }

.news .item { padding:22px 4px; border-top:1px solid var(--soft); display:flex; flex-direction:column }
.news .item:first-child { border-top:0 }
.news .item h3 { margin:0 0 6px; font-size:24px; line-height:1.25; letter-spacing:-.02em }

.empty { padding:56px 0 100px; max-width:460px }
.empty strong { display:block; font-size:26px; letter-spacing:-.02em; margin-bottom:6px }
.empty p { margin:0; color:var(--muted) }

/* ---------- dialogs ---------- */
.overlay {
  position:fixed; inset:0; z-index:40; background:#0007;
  display:flex; justify-content:center; align-items:center; padding:18px; overflow-y:auto;
}
.card {
  width:min(520px,100%); max-height:100%; overflow-y:auto; background:var(--bg);
  border-radius:28px; padding:28px;
}
.cardhead { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px }
.cardhead strong { font-size:26px; letter-spacing:-.03em }
.xbtn {
  border:0; background:var(--wash); width:38px; height:38px; border-radius:50%;
  font-size:18px; line-height:1;
}
.xbtn:hover { background:var(--soft) }
.addrowf { display:flex; gap:8px }
.addrowf input {
  flex:1; min-width:0; border:1.5px solid var(--fg); border-radius:999px; background:var(--bg);
  padding:11px 20px; font-size:16px;
}
.addrowf input:focus { outline:none; box-shadow:0 0 0 3px var(--soft) }
.error { margin-top:10px; font-size:14px; font-weight:600 }
.sub { margin:26px 0 8px; font-size:14px; color:var(--muted); font-weight:500 }
.feedlist { display:grid; gap:2px }
.feed {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px;
  cursor:pointer; font-size:15px;
}
.feed:hover { background:var(--wash) }
.feed.active { background:var(--wash); font-weight:700 }
.feedname { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
.remove { border:0; background:none; font-size:18px; line-height:1; padding:2px 8px; border-radius:999px; color:var(--muted) }
.remove:hover { background:var(--soft); color:var(--fg) }
.remove.armed { background:var(--fg); color:var(--bg); font-size:13px; font-weight:600; padding:4px 12px }
.row { display:flex; gap:8px; flex-wrap:wrap }
.linkbtn { background:none; border:0; padding:0; font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:3px }
.linkbtn:hover { color:var(--fg) }
.status { margin-top:16px; font-size:13px; color:var(--muted) }

.playerbox { width:min(960px,100%); background:var(--bg); padding:18px; border-radius:28px }
.playerbox.short { width:min(400px,100%) }
.playerhead { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px }
.playerhead strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:4px }
.playerlinks { display:flex; gap:12px; align-items:center }
.playerlinks a { font-size:13px; white-space:nowrap }
.player { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; border-radius:18px }
.short .player { aspect-ratio:9/16; max-height:72vh; margin:0 auto }
.player iframe { position:absolute; inset:0; width:100%; height:100%; border:0 }
.ytfallback {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:18px; color:#fff; background-size:cover; background-position:center;
}
.ytfallback::before { content:""; position:absolute; inset:0; background:#000b }
.ytfallback > * { position:relative }
.ytfallback a.big { background:#fff; color:#000; font-weight:700; padding:12px 24px; border-radius:999px; text-decoration:none }
.ytfallback small { color:#ddd; max-width:420px }

@media (max-width:640px) {
  .wrap { padding:0 18px }
  .head { padding-top:28px; padding-bottom:20px }
  .tab { padding:9px 18px; font-size:15px }
  .news .item h3 { font-size:20px }
  .card { padding:22px }
}
@media (prefers-reduced-motion:reduce) { * { transition:none !important } }
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1 class="title">EASY RSS <span aria-hidden="true">😎</span></h1>
    <div class="actions">
      <button class="pill" id="searchBtn" aria-expanded="false">Search</button>
      <button class="pill solid" id="openAdd">Add</button>
    </div>
  </header>

  <div class="searchbar hidden" id="searchBar">
    <input id="search" type="search" placeholder="Search your feeds" aria-label="Search">
  </div>
</div>

<div class="tabsbar">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-cat="videos">Videos</button>
      <button class="tab" role="tab" data-cat="shorts">Shorts</button>
      <button class="tab" role="tab" data-cat="news">News</button>
    </div>
    <div class="filterline hidden" id="feedChip">
      <span class="chip"><span id="feedChipName"></span><button id="clearFeed" aria-label="Show all feeds">×</button></span>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="articles"></div>
</main>

<!-- add dialog -->
<div id="addModal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Add a feed">
  <div class="card">
    <div class="cardhead">
      <strong>Add a feed</strong>
      <button class="xbtn" id="closeAdd" aria-label="Close">✕</button>
    </div>

    <form id="addForm" class="addrowf">
      <input id="feedUrl" type="url" required placeholder="Paste an RSS or Atom link">
      <button class="pill solid" id="addBtn">Add</button>
    </form>
    <div id="error" class="error"></div>

    <div id="feedsSection" class="hidden">
      <div class="sub">Your feeds</div>
      <div id="feedList" class="feedlist"></div>
    </div>

    <div class="sub">Manage</div>
    <div class="row">
      <button class="pill small" id="refresh">Refresh</button>
      <button class="pill small" id="markAll">Mark all read</button>
      <button class="pill small" id="unreadBtn" aria-pressed="false">Hide read</button>
    </div>
    <div class="row" style="margin-top:16px;gap:18px">
      <button class="linkbtn" id="export">Export OPML</button>
      <button class="linkbtn" id="import">Import OPML</button>
    </div>
    <input id="opmlFile" type="file" accept=".opml,.xml" class="hidden">
    <div class="status" id="status">Updates every 10 minutes</div>
  </div>
</div>

<!-- video dialog -->
<div id="videoModal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="playerbox" id="playerBox">
    <div class="playerhead">
      <strong id="videoTitle">YouTube video</strong>
      <div class="playerlinks">
        <a id="youtubeLink" href="#" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
        <button class="xbtn" id="closeVideo" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="player">
      <iframe id="youtubeFrame" title="YouTube video player"
        src="about:blank"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>
      <div id="ytFallback" class="ytfallback hidden">
        <a id="ytBig" class="big" href="#" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
        <small>YouTube blocks embedded playback for pages opened from a file. Host this page on http(s) to play videos right here.</small>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const STORAGE_KEY = "allTheTimeRss_v1";

let feeds = [];
let articles = [];
let activeFeed = "all";
let category = "videos";
let unreadOnly = false;
let query = "";
let busy = false;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  feeds = saved.feeds || [];
  articles = saved.articles || [];
} catch {}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({feeds, articles}));
  } catch {
    status("Storage full. Export your feeds as a backup.");
  }
}
function status(message) { $("status").textContent = message; }
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}
function cleanHTML(html) {
  const d = document.createElement("div");
  d.innerHTML = html || "";
  return (d.textContent || "").replace(/\s+/g, " ").trim();
}
function validURL(value) {
  try {
    const u = new URL(value);
    return ["https:", "http:"].includes(u.protocol) ? u.href : null;
  } catch { return null; }
}
function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}
function youtubeID(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^(www\.|m\.)/, "");
    if (host === "youtu.be")
      return u.pathname.split("/").filter(Boolean)[0] || null;
    if (["youtube.com", "music.youtube.com"].includes(host)) {
      if (u.pathname === "/watch") return u.searchParams.get("v");
      const match = u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);
      if (match) return match[2];
    }
  } catch {}
  return null;
}
function isShort(url) {
  try { return /^\/shorts\//.test(new URL(url).pathname); } catch { return false; }
}
function categoryOf(a) {
  if (!a.link) return "news";
  if (isShort(a.link)) return "shorts";
  if (youtubeID(a.link)) return "videos";
  return "news";
}
function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const days = (Date.now() - d.getTime()) / 864e5;
  if (days < 1) return "Today";
  if (days < 2) return "Yesterday";
  return d.toLocaleDateString(undefined, {day:"numeric", month:"short", year: days > 300 ? "numeric" : undefined});
}

/* ---------- dialogs ---------- */
function openVideo(article) {
  const id = youtubeID(article.link);
  if (!id) return;

  $("videoTitle").textContent = article.title || "YouTube video";
  $("youtubeLink").href = article.link;
  $("playerBox").classList.toggle("short", isShort(article.link));

  // YouTube refuses to embed (Error 153) when the page has no HTTP(S)
  // referrer, e.g. opened from disk (file://). Show a thumbnail and link instead.
  const canEmbed = ["http:", "https:"].includes(location.protocol);
  $("ytFallback").classList.toggle("hidden", canEmbed);

  if (canEmbed) {
    const params = new URLSearchParams({
      playsinline: "1", rel: "0", origin: location.origin
    });
    $("youtubeFrame").src =
      "https://www.youtube.com/embed/" + encodeURIComponent(id) +
      "?" + params.toString();
  } else {
    $("youtubeFrame").src = "about:blank";
    $("ytFallback").style.backgroundImage =
      "url(https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/hqdefault.jpg)";
    $("ytBig").href = article.link;
  }

  $("videoModal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeVideo() {
  $("youtubeFrame").src = "about:blank";
  $("videoModal").classList.add("hidden");
  document.body.style.overflow = "";
}
function openAdd() {
  $("addModal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  setTimeout(() => $("feedUrl").focus(), 30);
}
function closeAdd() {
  $("addModal").classList.add("hidden");
  document.body.style.overflow = "";
}
$("closeVideo").onclick = closeVideo;
$("closeAdd").onclick = closeAdd;
$("openAdd").onclick = openAdd;
$("videoModal").onclick = e => { if (e.target === $("videoModal")) closeVideo(); };
$("addModal").onclick = e => { if (e.target === $("addModal")) closeAdd(); };
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("videoModal").classList.contains("hidden")) closeVideo();
  else if (!$("addModal").classList.contains("hidden")) closeAdd();
  else if (!$("searchBar").classList.contains("hidden")) toggleSearch(false);
});

/* ---------- search ---------- */
function toggleSearch(show) {
  const on = show ?? $("searchBar").classList.contains("hidden");
  $("searchBar").classList.toggle("hidden", !on);
  $("searchBtn").setAttribute("aria-expanded", on ? "true" : "false");
  $("searchBtn").classList.toggle("solid", on);
  if (on) $("search").focus();
  else { $("search").value = ""; query = ""; renderArticles(); }
}
$("searchBtn").onclick = () => toggleSearch();
$("search").oninput = e => { query = e.target.value; renderArticles(); };

/* ---------- rendering ---------- */
function feedLabel(f) {
  let host = "";
  try { host = new URL(f.url).hostname; } catch {}
  if (f.title && f.title !== host) return f.title;
  // title is still just the hostname: use the name from loaded articles
  const a = articles.find(x => x.feedId === f.id && x.source && x.source !== host);
  return a ? a.source : (f.title || f.url);
}
function renderFeeds() {
  const root = $("feedList");
  root.innerHTML = "";
  $("feedsSection").classList.toggle("hidden", !feeds.length);

  if (feeds.length) {
    const all = document.createElement("div");
    all.className = "feed " + (activeFeed === "all" ? "active" : "");
    all.innerHTML = `<span class="feedname">All feeds</span>`;
    all.onclick = () => { activeFeed = "all"; renderFeeds(); renderArticles(); closeAdd(); };
    root.append(all);
  }

  feeds.forEach(feed => {
    const el = document.createElement("div");
    el.className = "feed " + (activeFeed === feed.id ? "active" : "");
    el.innerHTML = `<span class="feedname" title="${esc(feed.url)}">${esc(feedLabel(feed))}</span>
      <button class="remove" aria-label="Remove feed">×</button>`;
    el.onclick = e => {
      if (e.target.closest(".remove")) return;
      activeFeed = feed.id;
      renderFeeds();
      renderArticles();
      closeAdd();
    };
    const rm = el.querySelector(".remove");
    rm.onclick = e => {
      e.stopPropagation();
      // first click asks, second click removes (confirm() is blocked in many previews)
      if (!rm.classList.contains("armed")) {
        rm.classList.add("armed");
        rm.textContent = "Remove?";
        setTimeout(() => {
          if (rm.isConnected) { rm.classList.remove("armed"); rm.textContent = "×"; }
        }, 3000);
        return;
      }
      feeds = feeds.filter(f => f.id !== feed.id);
      articles = articles.filter(a => a.feedId !== feed.id);
      if (activeFeed === feed.id) activeFeed = "all";
      save(); renderFeeds(); renderArticles();
    };
    root.append(el);
  });
}

const LABELS = {videos:"videos", shorts:"shorts", news:"news"};

function renderArticles() {
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.cat === category ? "true" : "false"));
  $("unreadBtn").classList.toggle("solid", unreadOnly);
  $("unreadBtn").textContent = unreadOnly ? "Show read" : "Hide read";
  $("unreadBtn").setAttribute("aria-pressed", unreadOnly ? "true" : "false");

  let list = articles.filter(a =>
    (activeFeed === "all" || a.feedId === activeFeed) && categoryOf(a) === category);
  if (unreadOnly) list = list.filter(a => !a.read);
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(a => (a.title + " " + a.summary + " " + a.source).toLowerCase().includes(q));
  }
  list.sort((a,b) => (Date.parse(b.date)||0) - (Date.parse(a.date)||0));

  const feed = feeds.find(f => f.id === activeFeed);
  $("feedChip").classList.toggle("hidden", !feed);
  if (feed) $("feedChipName").textContent = feedLabel(feed);

  const root = $("articles");
  if (!list.length) {
    let msg;
    if (!feeds.length) msg = ["Nothing here yet", "Press Add and paste an RSS or Atom link to get started."];
    else if (query || unreadOnly) msg = ["No matches", "Clear the search or show read items."];
    else msg = ["No " + LABELS[category], "Your feeds have nothing in this tab. Try another one."];
    root.innerHTML = `<div class="empty"><strong>${msg[0]}</strong><p>${msg[1]}</p></div>`;
    return;
  }

  root.innerHTML = `<div class="grid ${category}">` + list.slice(0,400).map(a => {
    const id = youtubeID(a.link);
    const cls = "item" + (a.read ? " read" : "");
    const meta = `<div class="meta"><span>${esc(a.source)}</span><span>${esc(shortDate(a.date))}</span></div>`;
    const title = `<h3><a href="${esc(a.link || "#")}" data-item="${esc(a.id)}"
      ${id ? 'data-video="1"' : 'target="_blank" rel="noopener noreferrer"'}>${esc(a.title || "Untitled")}</a></h3>`;

    if (category === "news") {
      return `<article class="${cls}">${title}${meta}</article>`;
    }
    return `<article class="${cls}">
      <a class="thumb" href="${esc(a.link || "#")}" data-item="${esc(a.id)}" data-video="1" aria-label="Play ${esc(a.title)}">
        <img loading="lazy" alt="" src="https://i.ytimg.com/vi/${encodeURIComponent(id || "")}/${category === "shorts" ? "hq720" : "mqdefault"}.jpg"
          onerror="this.style.display='none'">
      </a>
      ${title}${meta}</article>`;
  }).join("") + "</div>";
}

$("articles").addEventListener("click", e => {
  const link = e.target.closest("a[data-item]");
  if (!link) return;
  const a = articles.find(x => x.id === link.dataset.item);
  if (!a) return;
  if (link.dataset.video) {
    e.preventDefault();
    openVideo(a);
  }
  if (!a.read) {
    a.read = true; save();
    setTimeout(renderArticles, 150);
  }
});

/* ---------- tabs and filters ---------- */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => { category = t.dataset.cat; renderArticles(); };
});
$("unreadBtn").onclick = () => { unreadOnly = !unreadOnly; renderArticles(); };
$("clearFeed").onclick = () => { activeFeed = "all"; renderFeeds(); renderArticles(); };

// open on the first tab that actually has content
function pickCategory() {
  const has = c => articles.some(a => categoryOf(a) === c);
  if (!has(category)) {
    const first = ["videos", "shorts", "news"].find(has);
    if (first) category = first;
  }
}

/* ---------- feed parsing ---------- */
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  if (doc.querySelector("parsererror")) throw Error("Invalid XML feed.");

  const rss = [...doc.querySelectorAll("item")];
  const atom = [...doc.querySelectorAll("entry")];
  const items = rss.length ? rss : atom;
  if (!items.length) throw Error("No RSS/Atom entries found.");

  const get = (node, selector) =>
    node.querySelector(selector)?.textContent?.trim() || "";
  const isYT = /(^|\.)youtube\.com$/.test(new URL(feed.url).hostname);
  const title = (isYT && get(doc, "feed > author > name")) ||
    get(doc, "channel > title") || get(doc, "feed > title") ||
    new URL(feed.url).hostname;
  const old = new Map(articles.filter(a => a.feedId === feed.id)
    .map(a => [a.guid, a]));

  const parsed = items.slice(0,250).map((item, i) => {
    const link = item.querySelector("link[href]")?.getAttribute("href") ||
      get(item, "link");
    const guid = get(item, "guid") || get(item, "id") || link ||
      get(item, "title") + i;
    const previous = old.get(guid);
    const date = get(item, "pubDate") || get(item, "published") ||
      get(item, "updated");
    const parsedDate = Date.parse(date);
    return {
      id: previous?.id || feed.id + "_" + hash(guid),
      feedId: feed.id, source: title,
      title: get(item, "title") || "Untitled article",
      link: validURL(link) || "",
      summary: cleanHTML(get(item, "description") || get(item, "summary") ||
        get(item, "encoded") || get(item, "content")),
      date: Number.isFinite(parsedDate) ? new Date(parsedDate).toISOString() : "",
      guid, read: previous?.read || false
    };
  });

  feed.title = title;
  feed.lastFetch = new Date().toISOString();
  articles = articles.filter(a => a.feedId !== feed.id).concat(parsed);
}

function timedFetch(url, ms = 8000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, {signal: ctl.signal}).finally(() => clearTimeout(t));
}
function looksLikeFeed(text) {
  return /<(rss|feed|rdf:RDF)[\s>]/i.test(text.slice(0, 3000));
}
async function fetchFeed(feed) {
  const u = encodeURIComponent(feed.url);
  const sources = [
    feed.url,
    "https://api.allorigins.win/raw?url=" + u,
    "https://corsproxy.io/?url=" + u
  ];
  // try every route at once; the first one that returns a real feed wins
  const text = await Promise.any(sources.map(async src => {
    const r = await timedFetch(src);
    if (!r.ok) throw Error("HTTP " + r.status);
    const t = await r.text();
    if (!looksLikeFeed(t)) throw Error("Not a feed");
    return t;
  })).catch(() => { throw Error("Could not fetch this feed."); });
  parseFeed(text, feed);
  save();
}

async function refresh(list = feeds) {
  if (busy) return;
  busy = true;
  $("refresh").disabled = $("addBtn").disabled = true;
  status(`Refreshing ${list.length} feed${list.length === 1 ? "" : "s"}…`);
  const results = await Promise.allSettled(list.map(fetchFeed));
  const succeeded = results.filter(r => r.status === "fulfilled").length;
  const failed = results.length - succeeded;
  busy = false;
  $("refresh").disabled = $("addBtn").disabled = false;
  pickCategory();
  save(); renderFeeds(); renderArticles();
  status(`Updated ${succeeded} of ${list.length} feeds at ${new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}`);
  if (failed) $("error").textContent =
    "Some feeds failed to load. The site may block browser access.";
}

/* ---------- feed management ---------- */
$("addForm").onsubmit = async e => {
  e.preventDefault();
  $("error").textContent = "";
  const url = validURL($("feedUrl").value.trim());
  if (!url) { $("error").textContent = "Enter a valid HTTP(S) URL."; return; }
  if (feeds.some(f => f.url === url)) {
    $("error").textContent = "That feed is already added."; return;
  }
  const feed = {id:"f_" + hash(url), url, title:new URL(url).hostname};
  feeds.push(feed); save(); renderFeeds();
  $("feedUrl").value = "";
  try { await fetchFeed(feed); status("Feed added"); }
  catch (e) { $("error").textContent = "Saved, but it couldn't load: " + e.message; }
  pickCategory();
  save(); renderFeeds(); renderArticles();
};

$("refresh").onclick = () => refresh();
$("markAll").onclick = () => {
  articles.forEach(a => a.read = true);
  save(); renderArticles();
};

$("export").onclick = () => {
  const doc = `<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0"><head><title>Easy RSS</title></head><body>${
    feeds.map(f => `<outline text="${esc(f.title)}" title="${esc(f.title)}" type="rss" xmlUrl="${esc(f.url)}"/>`).join("")
  }</body></opml>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([doc],{type:"text/xml"}));
  a.download = "easy-rss-feeds.opml";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("import").onclick = () => $("opmlFile").click();
$("opmlFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const doc = new DOMParser().parseFromString(await file.text(),"text/xml");
    [...doc.querySelectorAll("outline[xmlUrl],outline[xmlurl]")].forEach(o => {
      const url = validURL(o.getAttribute("xmlUrl") || o.getAttribute("xmlurl"));
      if (url && !feeds.some(f => f.url === url))
        feeds.push({id:"f_"+hash(url),url,
          title:o.getAttribute("title") || o.getAttribute("text") || new URL(url).hostname});
    });
    save(); renderFeeds(); refresh();
  } catch { $("error").textContent = "Couldn't import that OPML file."; }
  e.target.value = "";
};

/* ---------- start ---------- */
pickCategory();
renderFeeds();
renderArticles();
if (feeds.length) refresh();
setInterval(() => {
  if (feeds.length && !document.hidden) refresh();
}, 10 * 60 * 1000);

})();
</script>
